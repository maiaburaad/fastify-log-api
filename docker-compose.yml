services:
  postgres:
    image: postgres:17-alpine
    container_name: fastify-log-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logs_db

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logs_db"]
      interval: 2s
      timeout: 2s
      retries: 20

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fastify-log-api

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: logs_db
      DB_POOL_MAX: 10
      RETENTION_DAYS: 30

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  postgres_data: